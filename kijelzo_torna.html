<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>4 Csapatos Teke - Élő Kijelző</title>
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    body {
        background-color: #00122e;
        color: #ffff00;
        padding: 8px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        display: flex;
        flex-direction: column;
    }
    .board-container {
        width: 100%;
        height: 100%;
        margin: 0 auto;
        background: #001c47;
        border: 3px solid #0044aa;
        border-radius: 8px;
        padding: 8px 12px;
        box-shadow: 0 0 25px rgba(0, 50, 150, 0.8);
        display: flex;
        flex-direction: column;
    }
    h1 {
        text-align: center;
        margin: 0 0 6px 0;
        font-size: 2.2rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        flex-shrink: 0;
    }
    .teams-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
        flex-grow: 1;
        min-height: 0;
    }
    .team-box {
        background: rgba(0, 28, 71, 0.85);
        border: 2px solid #0044aa;
        border-radius: 6px;
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        overflow: hidden;
    }
    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #0044aa;
        padding-bottom: 4px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }
    .team-info {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .team-logo {
        width: 36px;
        height: 36px;
        object-fit: contain;
    }
    .team-name { 
        font-size: 1.4rem; 
        font-weight: bold; 
        color: #ffff00; 
        text-transform: uppercase; 
    }
    .team-score { 
        font-size: 1.6rem; 
        font-weight: bold; 
        color: #00ff66; 
    }
    
    table { 
        width: 100%; 
        border-collapse: collapse; 
        font-family: 'Courier New', Courier, monospace;
    }
    th { 
        color: #8b949e; 
        padding: 2px 2px; 
        font-size: 0.9rem; 
        border-bottom: 2px solid #002b66; 
    }
    td { 
        padding: 3px 2px; 
        text-align: center; 
        border-bottom: 1px solid rgba(0, 68, 170, 0.3); 
        font-size: 1.15rem; 
        font-weight: bold; 
    }
    /* Megnövelt hely a neveknek, rugalmas törés nélkül */
    .name-col { 
        text-align: left; 
        font-family: sans-serif; 
        color: #ffffff; 
        width: 45%; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        font-size: 1.05rem;
    }
    
    .color-green { color: #00ff66 !important; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }
    .total-col { font-weight: bold; font-size: 1.25rem; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <h1 id="boardTitle">4 CSAPATOS TORNA</h1>
    <div class="teams-grid" id="boardGrid"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.firebasestorage.app"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('csapat4_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.title) document.getElementById('boardTitle').innerText = data.title.toUpperCase();
        if (data.teams) renderBoard(data.teams);
    }
});

function getSetColorClass(val) {
    if (val === 0) return '';
    if (val > 150) return 'color-green';
    if (val < 120) return 'color-red';
    return 'color-yellow';
}

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function renderBoard(teams) {
    const sorted = [...teams].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        return a.ures - b.ures;
    });

    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';

    sorted.forEach((team, rankIdx) => {
        const box = document.createElement('div');
        box.className = 'team-box';

        let rowsHTML = '';
        team.players.forEach(p => {
            const setsHTML = p.sets.map(s => s === 0 ? '<td>-</td>' : '<td class="' + getSetColorClass(s) + '">' + s + '</td>').join('');
            rowsHTML += '<tr>' +
                '<td class="name-col">' + p.name + '</td>' +
                setsHTML +
                '<td class="' + getUresColorClass(p.ures) + '">' + p.ures + '</td>' +
                '<td class="total-col ' + getTotalColorClass(p.total) + '">' + p.total + '</td>' +
            '</tr>';
        });

        const logoHTML = team.logo ? '<img src="' + team.logo + '" class="team-logo" alt="Címer">' : '';

        box.innerHTML = '<div class="team-header">' +
                '<div class="team-info">' +
                    logoHTML +
                    '<span class="team-name">' + (rankIdx + 1) + '. ' + team.name + '</span>' +
                '</div>' +
                '<span class="team-score">' + team.total + ' fa</span>' +
            '</div>' +
            '<table>' +
                '<thead>' +
                    '<tr>' +
                        '<th style="text-align:left; width: 45%;">Név</th>' +
                        '<th>S1</th><th>S2</th><th>S3</th><th>S4</th>' +
                        '<th>Üres</th>' +
                        '<th>Össz.</th>' +
                    '</tr>' +
                '</thead>' +
                '<tbody>' +
                    rowsHTML +
                '</tbody>' +
            '</table>';
        grid.appendChild(box);
    });
}
</script>
</body>
</html>
