<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>4 Csapatos Teke - Élő Kijelző</title>
<style>
    * {
        box-sizing: border-box;
    }
    html, body {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    body {
        background-color: #000d21;
        color: #ffff00;
        padding: 10px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        display: flex;
        flex-direction: column;
    }
    .board-container {
        width: 100%;
        height: 100%;
        margin: 0 auto;
        background: #00173d;
        border: 3px solid #0044aa;
        border-radius: 12px;
        padding: 10px 14px;
        box-shadow: 0 0 30px rgba(0, 50, 150, 0.8), inset 0 0 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
    }
    
    h1 {
        text-align: center;
        margin: 0 0 6px 0;
        font-size: 2.8rem;
        line-height: 1.1;
        font-weight: 900;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 15px rgba(255, 255, 0, 0.7);
        flex-shrink: 0;
    }
    
    .teams-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
        flex-grow: 1;
        min-height: 0;
    }
    .team-box {
        background: rgba(0, 20, 55, 0.9);
        border: 2px solid #003b99;
        border-radius: 10px;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    }
    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #0044aa;
        padding-bottom: 4px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }
    .team-info {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 70%;
    }
    .team-logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .team-name { 
        font-size: 2.6rem; 
        font-weight: 900; 
        color: #ffff00; 
        text-transform: uppercase; 
        text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        letter-spacing: 0.5px;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .team-score { 
        font-size: 2.3rem; 
        font-weight: bold; 
        color: #00ff66; 
        text-shadow: 0 0 10px rgba(0,255,102,0.5);
        white-space: nowrap;
    }
    
    table { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0 6px; /* MEGNÖVELT RÉG A SOROK KÖZÖTT */
        font-family: 'Courier New', Courier, monospace;
    }
    th { 
        color: #9cb0d4; 
        padding: 2px 6px; 
        font-size: 1.1rem; 
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    tbody tr {
        background: linear-gradient(180deg, #002866 0%, #001840 100%);
        box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
        border-radius: 6px;
    }
    
    tbody tr td:first-child {
        border-top-left-radius: 6px;
        border-bottom-left-radius: 6px;
    }
    tbody tr td:last-child {
        border-top-right-radius: 6px;
        border-bottom-right-radius: 6px;
    }

    /* MAGASABB MEGJELENÉS A CELLÁKNÁL */
    td { 
        padding: 8px 4px; 
        text-align: center; 
        font-size: 1.5rem; 
        font-weight: bold; 
        border: none;
    }
    
    .name-col { 
        text-align: left; 
        font-family: sans-serif; 
        color: #ffffff; 
        width: 40%; 
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
        font-size: 1.4rem;
        padding-left: 12px;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    
    .color-green { color: #00ff66 !important; text-shadow: 0 0 8px rgba(0, 255, 102, 0.6); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 8px rgba(255, 255, 0, 0.6); }
    .color-red { color: #ff4444 !important; text-shadow: 0 0 8px rgba(255, 68, 68, 0.6); }
    .total-col { font-weight: bold; font-size: 1.6rem; padding-right: 8px; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <h1 id="boardTitle">FELKÉSZÜLÉSI NÉGYES TORNA<br>08.29 | TISZAKÉCSKE</h1>
    <div class="teams-grid" id="boardGrid"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.firebasestorage.app"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('csapat4_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.title) {
            document.getElementById('boardTitle').innerHTML = data.title.toUpperCase().replace('\n', '<br>');
        }
        if (data.teams) renderBoard(data.teams);
    }
});

function getSetColorClass(val) {
    if (val === 0) return '';
    if (val > 150) return 'color-green';
    if (val < 120) return 'color-red';
    return 'color-yellow';
}

function getTotalColorClass(val) {
    if (val === 0) return '';
    if (val > 600) return 'color-green';
    if (val < 500) return 'color-red';
    return 'color-yellow';
}

function getUresColorClass(val) {
    if (val === 0) return 'color-green';
    if (val <= 5) return 'color-yellow';
    return 'color-red';
}

function renderBoard(teams) {
    const sorted = [...teams].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        return a.ures - b.ures;
    });

    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';

    sorted.forEach((team, rankIdx) => {
        const box = document.createElement('div');
        box.className = 'team-box';

        let rowsHTML = '';
        team.players.forEach(p => {
            const setsHTML = p.sets.map(s => s === 0 ? '<td>-</td>' : '<td class="' + getSetColorClass(s) + '">' + s + '</td>').join('');
            rowsHTML += '<tr>' +
                '<td class="name-col">' + p.name + '</td>' +
                setsHTML +
                '<td class="' + getUresColorClass(p.ures) + '">' + p.ures + '</td>' +
                '<td class="total-col ' + getTotalColorClass(p.total) + '">' + p.total + '</td>' +
            '</tr>';
        });

        const logoHTML = team.logo ? '<img src="' + team.logo + '" class="team-logo" alt="Címer">' : '';

        box.innerHTML = '<div class="team-header">' +
                '<div class="team-info">' +
                    logoHTML +
                    '<span class="team-name">' + (rankIdx + 1) + '. ' + team.name + '</span>' +
                '</div>' +
                '<span class="team-score">' + team.total + ' fa</span>' +
            '</div>' +
            '<table>' +
                '<thead>' +
                    '<tr>' +
                        '<th style="text-align:left; width: 40%; padding-left:12px;">Név</th>' +
                        '<th>S1</th><th>S2</th><th>S3</th><th>S4</th>' +
                        '<th>Üres</th>' +
                        '<th>Össz.</th>' +
                    '</tr>' +
                '</thead>' +
                '<tbody>' +
                    rowsHTML +
                '</tbody>' +
            '</table>';
        grid.appendChild(box);
    });
}
</script>
</body>
</html>
