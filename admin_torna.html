<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Csapatos Teke - Adminisztráció</title>
<style>
    body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 15px;
    }
    .admin-container {
        max-width: 1400px;
        margin: 0 auto;
    }
    h1 {
        text-align: center;
        color: #fbbf24;
        margin-bottom: 20px;
    }
    .title-box {
        background: #1e293b;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .title-box input {
        flex: 1;
        padding: 8px 12px;
        font-size: 1rem;
        border-radius: 4px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #fff;
    }
    .btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
    .btn:hover { background: #1d4ed8; }
    .teams-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
        gap: 20px;
    }
    .team-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 15px;
    }
    .team-title-input {
        width: 100%;
        padding: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fbbf24;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 4px;
        margin-bottom: 12px;
        box-sizing: border-box;
    }
    table { width: 100%; border-collapse: collapse; }
    th { color: #94a3b8; font-size: 0.85rem; padding: 6px; text-align: center; }
    td { padding: 3px; text-align: center; }
    input[type="text"] { width: 100%; padding: 5px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    input[type="number"] { width: 50px; padding: 5px; text-align: center; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .status-msg { text-align: center; color: #22c55e; font-weight: bold; height: 20px; margin-bottom: 10px; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="admin-container">
    <h1>4 Csapatos Teketorna - Kezelőfelület (6 Játékos / Csapat)</h1>
    <div id="statusMsg" class="status-msg"></div>

    <div class="title-box">
        <label style="font-weight:bold;">Torna neve:</label>
        <input type="text" id="tournamentTitle" value="4 CSAPATOS TORNA">
        <button class="btn" onclick="saveData()">Mentés & Kijelző Frissítése</button>
    </div>

    <div class="teams-grid" id="teamsContainer"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.firebasestorage.app"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let currentData = {
    title: "4 CSAPATOS TORNA",
    teams: Array.from({ length: 4 }, (_, i) => ({
        name: (i + 1) + ". CSAPAT",
        players: Array.from({ length: 6 }, () => ({
            name: "Játékos",
            sets: [0, 0, 0, 0],
            ures: 0,
            total: 0
        })),
        total: 0,
        ures: 0
    }))
};

db.ref('csapat4_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data && data.teams) {
        // Garantáljuk a 6 játékost csapatonként
        data.teams.forEach(t => {
            if (!t.players) t.players = [];
            while (t.players.length < 6) {
                t.players.push({ name: "Játékos", sets: [0,0,0,0], ures: 0, total: 0 });
            }
        });
        currentData = data;
        document.getElementById('tournamentTitle').value = currentData.title || "4 CSAPATOS TORNA";
    }
    renderAdminUI();
});

function renderAdminUI() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';

    currentData.teams.forEach((team, tIdx) => {
        const card = document.createElement('div');
        card.className = 'team-card';

        let rowsHTML = '';
        team.players.forEach((p, pIdx) => {
            rowsHTML += `<tr>
                <td><input type="text" value="${p.name}" onchange="updatePlayerName(${tIdx}, ${pIdx}, this.value)"></td>
                <td><input type="number" value="${p.sets[0] || 0}" onchange="updateSet(${tIdx}, ${pIdx}, 0, this.value)"></td>
                <td><input type="number" value="${p.sets[1] || 0}" onchange="updateSet(${tIdx}, ${pIdx}, 1, this.value)"></td>
                <td><input type="number" value="${p.sets[2] || 0}" onchange="updateSet(${tIdx}, ${pIdx}, 2, this.value)"></td>
                <td><input type="number" value="${p.sets[3] || 0}" onchange="updateSet(${tIdx}, ${pIdx}, 3, this.value)"></td>
                <td><input type="number" value="${p.ures || 0}" onchange="updateUres(${tIdx}, ${pIdx}, this.value)"></td>
                <td style="font-weight:bold; color:#22c55e;">${p.total}</td>
            </tr>`;
        });

        card.innerHTML = `
            <input type="text" class="team-title-input" value="${team.name}" onchange="updateTeamName(${tIdx}, this.value)">
            <table>
                <thead>
                    <tr>
                        <th style="text-align:left;">Név</th>
                        <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                        <th>Üres</th>
                        <th>Össz.</th>
                    </tr>
                </thead>
                <tbody>${rowsHTML}</tbody>
            </table>
        `;
        container.appendChild(card);
    });
}

function updateTeamName(tIdx, val) {
    currentData.teams[tIdx].name = val;
    saveData();
}

function updatePlayerName(tIdx, pIdx, val) {
    currentData.teams[tIdx].players[pIdx].name = val;
    saveData();
}

function updateSet(tIdx, pIdx, setIdx, val) {
    currentData.teams[tIdx].players[pIdx].sets[setIdx] = parseInt(val) || 0;
    recalcTotals();
    saveData();
}

function updateUres(tIdx, pIdx, val) {
    currentData.teams[tIdx].players[pIdx].ures = parseInt(val) || 0;
    recalcTotals();
    saveData();
}

function recalcTotals() {
    currentData.teams.forEach(team => {
        let teamTotal = 0;
        let teamUres = 0;
        team.players.forEach(p => {
            p.total = p.sets.reduce((a, b) => a + b, 0);
            teamTotal += p.total;
            teamUres += (p.ures || 0);
        });
        team.total = teamTotal;
        team.ures = teamUres;
    });
}

function saveData() {
    currentData.title = document.getElementById('tournamentTitle').value;
    recalcTotals();
    db.ref('csapat4_bowling').set(currentData).then(() => {
        showStatus("Mentve & Kijelző Frissítve!");
    });
}

function showStatus(msg) {
    const el = document.getElementById('statusMsg');
    el.innerText = msg;
    setTimeout(() => { el.innerText = ''; }, 2000);
}
</script>
</body>
</html>
