<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>Négyes Torna Kijelző (1080p)</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000c1f;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    
    /* Fő tároló: teljes képernyő kitöltése */
    .container {
        width: 100%;
        height: 100vh;
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Fejléc */
    .header-title {
        text-align: center;
        font-size: 2.2rem;
        font-weight: bold;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        padding-bottom: 5px;
        flex: 0 0 auto;
    }

    /* A 4 blokk rácsos elrendezése - kitölti a képernyőt lefelé */
    .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 15px;
        flex: 1;
        margin-top: 5px;
    }

    /* Egy-egy csapat kártyája */
    .team-card {
        background-color: #001c47;
        border: 2px solid #0044aa;
        border-radius: 12px;
        padding: 12px 18px;
        box-shadow: 0 0 20px rgba(0, 50, 150, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    /* Csapatnév és fa összefoglaló fejléc */
    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffff00;
        border-bottom: 2px solid #0044aa;
        padding-bottom: 6px;
        margin-bottom: 8px;
    }
    .team-header .pins-total {
        color: #00ff66;
        font-size: 2rem;
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    /* Táblázat méretezése */
    .table-container {
        flex: 1;
        display: flex;
        align-items: center;
    }
    .board-table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
    }
    .board-table th {
        color: #ffff00;
        font-size: 1.1rem;
        padding: 6px 4px;
        border-bottom: 2px solid #0044aa;
        text-align: center;
    }
    .board-table td {
        padding: 8px 4px; /* Magasabb sorok! */
        text-align: center;
        font-size: 1.45rem; /* Nagyobb számok */
        font-weight: bold;
        border-bottom: 1px solid #002b66;
        color: #ffffff;
    }

    /* Nevek és kiemelések */
    .name-col {
        text-align: left !important;
        color: #ffff00;
        width: 32%;
        font-family: sans-serif;
        font-size: 1.3rem; /* Nagyobb névbetűk */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .val-total {
        color: #00ff66;
        font-size: 1.5rem;
    }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header-title" id="tournamentTitle">NÉGYES TORNA</div>

    <div class="grid-container">
        <!-- 1. CSAPAT -->
        <div class="team-card">
            <div class="team-header">
                <span id="t1Name">1. CSAPAT</span>
                <span class="pins-total" id="t1TotalPins">0 fa</span>
            </div>
            <div class="table-container">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="name-col">Név</th>
                            <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                            <th>Üres</th>
                            <th>Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="t1Body"></tbody>
                </table>
            </div>
        </div>

        <!-- 2. CSAPAT -->
        <div class="team-card">
            <div class="team-header">
                <span id="t2Name">2. CSAPAT</span>
                <span class="pins-total" id="t2TotalPins">0 fa</span>
            </div>
            <div class="table-container">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="name-col">Név</th>
                            <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                            <th>Üres</th>
                            <th>Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="t2Body"></tbody>
                </table>
            </div>
        </div>

        <!-- 3. CSAPAT -->
        <div class="team-card">
            <div class="team-header">
                <span id="t3Name">3. CSAPAT</span>
                <span class="pins-total" id="t3TotalPins">0 fa</span>
            </div>
            <div class="table-container">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="name-col">Név</th>
                            <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                            <th>Üres</th>
                            <th>Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="t3Body"></tbody>
                </table>
            </div>
        </div>

        <!-- 4. CSAPAT -->
        <div class="team-card">
            <div class="team-header">
                <span id="t4Name">4. CSAPAT</span>
                <span class="pins-total" id="t4TotalPins">0 fa</span>
            </div>
            <div class="table-container">
                <table class="board-table">
                    <thead>
                        <tr>
                            <th class="name-col">Név</th>
                            <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                            <th>Üres</th>
                            <th>Össz.</th>
                        </tr>
                    </thead>
                    <tbody id="t4Body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('negyes_torna_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.title) {
            document.getElementById('tournamentTitle').innerText = data.title.toUpperCase();
        }

        for (let i = 1; i <= 4; i++) {
            const teamData = data[`team${i}`];
            if (teamData) {
                renderTeam(i, teamData);
            }
        }
    }
});

function renderTeam(teamIdx, teamData) {
    document.getElementById(`t${teamIdx}Name`).innerText = `${teamIdx}. ${teamData.name || 'CSAPAT ' + teamIdx}`;
    
    const tbody = document.getElementById(`t${teamIdx}Body`);
    tbody.innerHTML = '';
    
    let grandTotal = 0;

    if (teamData.players && Array.isArray(teamData.players)) {
        teamData.players.forEach(p => {
            const s1 = parseInt(p.s1) || 0;
            const s2 = parseInt(p.s2) || 0;
            const s3 = parseInt(p.s3) || 0;
            const s4 = parseInt(p.s4) || 0;
            const ures = p.ures !== undefined && p.ures !== '' ? p.ures : 0;
            
            const total = s1 + s2 + s3 + s4;
            grandTotal += total;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="name-col">${p.name || '-'}</td>
                <td>${s1 || '-'}</td>
                <td>${s2 || '-'}</td>
                <td>${s3 || '-'}</td>
                <td>${s4 || '-'}</td>
                <td>${ures}</td>
                <td class="val-total">${total || '0'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById(`t${teamIdx}TotalPins`).innerText = `${grandTotal} fa`;
}
</script>
</body>
</html>
